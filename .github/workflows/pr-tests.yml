name: Pull request tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure tests, lint and synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # make check ends with the pre-commit hooks, and the runner image has no pre-commit.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit==4.6.2
      - run: make check
        env:
          # That hook guards local commits. This workflow also runs on pushes to main, where it would fail.
          SKIP: no-commit-to-branch
      - run: make test
      - run: make synth

  app:
    name: App tests, lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cd app && pnpm check && pnpm test

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install detect-secrets==1.5.0
      - run: git ls-files -z -- ':!pnpm-lock.yaml' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
